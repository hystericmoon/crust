[package]
name = "crust-desktop"
version = "0.1.0"
description = "Crust for Mac and Windows: the builder in a native window, sites kept on the computer."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "crust_desktop"
path = "src/lib.rs"

[[bin]]
name = "crust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27"
