[package]
name = "crust-desktop"
version = "0.1.0"
description = "Crust for Mac and Windows: the builder in a native window, sites kept on the computer."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "crust_desktop"
path = "src/lib.rs"

[[bin]]
name = "crust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# F056: checks, sitemap, photos and the search index, as the pipeline does.
crust-publish = { path = "../crust-publish", features = ["search"] }
anyhow = "1.0"
# Folder picker for "Export site folder"; opening the browser and the folder.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png"] }
