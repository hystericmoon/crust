[package]
name = "crust-desktop"
version = "0.1.0"
description = "Crust for Mac and Windows: the builder in a native window, sites kept on the computer."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "crust_desktop"
path = "src/lib.rs"

[[bin]]
name = "crust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# F056: checks, sitemap, photos and the search index, as the pipeline does.
crust-publish = { path = "../crust-publish", features = ["search"] }
anyhow = "1.0"
# Folder picker for "Export site folder"; opening the browser and the folder.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "json"] }
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
sha1_smol = "1.0.1"
base64 = "0.22"
# F059: FTP/FTPS (suppaftp, MIT OR Apache-2.0) and SFTP (russh + russh-sftp,
# Apache-2.0), both on rustls/ring like ureq above.
suppaftp = { version = "12.2", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
# F061: updates built in (Tauri's updater, MIT OR Apache-2.0); signatures checked
# against the update key's public half before anything is installed.
tauri-plugin-updater = "2"
url = "2"

[dev-dependencies]
# F061: a mock app for the updater tests, and a test update key to sign with.
tauri = { version = "2", features = ["test"] }
tempfile = "3.27"
image = { version = "0.25", default-features = false, features = ["png"] }
# F059: real FTP/FTPS and SFTP servers inside the tests (no outside server needed in CI).
libunftp = { version = "0.24", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
unftp-core = "0.1"
async-trait = "0.1"
minisign = "0.10.0"

# F058: host tokens live in the computer's keychain, never in the site folder.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
