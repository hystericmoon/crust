[package]
name = "crust-publish"
version = "0.1.0"
description = "Crust publish engine: turns rendered pages into a finished static site."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
# F081: AVIF copies (rav1e, BSD-2; no assembly so no NASM is needed to build)
# and lossy WebP copies (libwebp, BSD-3, built from source by libwebp-sys).
ravif = { version = "0.13", default-features = false, features = ["threading"] }
webp = { version = "0.3", default-features = false }
# F056: the search index inside the desktop app (the pipeline runs the
# Pagefind command instead). Same version as package.json's pagefind.
pagefind = { version = "=1.5.2", default-features = false, optional = true }
# io-util: Pagefind needs it but only asks for it through its (unused) server.
tokio = { version = "1", features = ["rt-multi-thread", "io-util"], optional = true }

[features]
search = ["dep:pagefind", "dep:tokio"]

[dev-dependencies]
tempfile = "3.27"
