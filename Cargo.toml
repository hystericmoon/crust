[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Photos are resized at publish time (F034) with `cargo run`, a dev build;
# optimised dependencies keep that fast.
[profile.dev.package."*"]
opt-level = 2


# F081: the AVIF encoder's code is built inside crust-publish (Rust compiles
# generic code where it's used), so it's optimised too: a photo takes about
# 0.4 s instead of 5 s.
[profile.dev.package.crust-publish]
opt-level = 2
