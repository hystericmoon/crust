# Opens the built Mac app the way a person does (from Finder's launcher),
# waits, and records what it is doing: a stack sample, a screenshot, its
# output, the system log and any crash report. Started by hand (Actions →
# Desktop launch test → Run workflow). For finding out why the app doesn't
# open on the owner's Mac.
#
# It builds the same combined (Apple chip + Intel) installer as the release
# workflow, copies the app out of the disk image into /Applications, marks
# it as downloaded from the internet (the quarantine flag a browser sets),
# and opens it twice: once as built, once ad-hoc signed, to see whether
# signing is what makes the difference.
name: Desktop launch test

on:
  workflow_dispatch:
  # Lets it run from the session branch before it is on main.
  push:
    branches: [ccr-d50f7e80-weuq18]
    paths: [.github/workflows/desktop-smoke.yml]

permissions:
  contents: read

concurrency:
  group: desktop-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Build the combined installer (same as the release)
        run: npm run desktop:build -- --target universal-apple-darwin

      - name: Install from the disk image, as downloaded
        shell: bash
        run: |
          mkdir -p smoke
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          echo "dmg: $dmg" | tee smoke/notes.txt
          uname -m | tee -a smoke/notes.txt
          sw_vers | tee -a smoke/notes.txt
          spctl --status 2>&1 | tee -a smoke/notes.txt || true
          # A browser marks downloads with this flag; Finder copies it on.
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/CrustSmoke "$dmg" >/dev/null
          src=$(find /Volumes/CrustSmoke -maxdepth 1 -name '*.app' | head -n 1)
          echo "app in image: $src" | tee -a smoke/notes.txt
          ditto "$src" /Applications/Crust-built.app
          ditto "$src" /Applications/Crust-adhoc.app
          hdiutil detach /Volumes/CrustSmoke >/dev/null || true
          for a in built adhoc; do
            xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "/Applications/Crust-$a.app"
          done
          codesign --force --deep -s - /Applications/Crust-adhoc.app 2>&1 | tee -a smoke/notes.txt
          for a in built adhoc; do
            app="/Applications/Crust-$a.app"
            {
              echo "=== $a"
              xattr -l "$app"
              lipo -info "$app"/Contents/MacOS/* 2>&1
              codesign -dv --verbose=2 "$app" 2>&1
              codesign --verify --deep --strict "$app" 2>&1 && echo "verify: ok"
              spctl --assess --type execute -vv "$app" 2>&1
              syspolicy_check distribution "$app" 2>&1 | head -n 40
            } >> "smoke/signing.txt" || true
          done

      - name: Open each copy and watch
        shell: bash
        run: |
          for a in built adhoc; do
            app="/Applications/Crust-$a.app"
            start=$(date '+%Y-%m-%d %H:%M:%S')
            echo "=== $a, opened $start" | tee -a smoke/notes.txt
            open "$app" 2>&1 | tee -a smoke/notes.txt || true
            for t in 10 20 30 40; do
              sleep 10
              echo "--- after about $t s" | tee -a smoke/notes.txt
              pgrep -lf "Crust-$a.app" | tee -a smoke/notes.txt || echo "not running" | tee -a smoke/notes.txt
            done
            pid=$(pgrep -f "Crust-$a.app/Contents/MacOS" | head -n 1 || true)
            if [ -n "$pid" ]; then
              sample "$pid" 5 -file "smoke/sample-$a.txt" || true
            fi
            screencapture -x "smoke/screen-$a.png" || true
            osascript -e 'tell application "System Events" to get the name of every window of every process' > "smoke/windows-$a.txt" 2>&1 || true
            log show --style compact --start "$start" \
              --predicate 'process == "crust" OR process == "syspolicyd" OR process == "XprotectService" OR (process == "launchd" AND eventMessage CONTAINS[c] "crust") OR eventMessage CONTAINS[c] "Crust-'"$a"'"' \
              > "smoke/log-$a.txt" 2>&1 || true
            pkill -f "Crust-$a.app/Contents/MacOS" || true
            sleep 3
          done
          ls -la "$HOME/Documents" > smoke/documents.txt 2>&1 || true
          cp "$HOME"/Library/Logs/DiagnosticReports/*[Cc]rust* smoke/ 2>/dev/null || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-test
          path: smoke
          if-no-files-found: warn
          retention-days: 14
