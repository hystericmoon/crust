# The Crust home page (home/content, built with Crust itself). Runs only when
# started by hand (Actions → Publish home → Run workflow), so nothing goes
# live by accident. Renders home/content/ to static HTML, runs crust-publish,
# the accessibility check, and deploys to the Cloudflare Pages project
# "crust-home". Uses the same Cloudflare secrets as the site and the store.
# The templates, help and licence pages live on the store; the Download button
# goes to the downloads site (crust-downloads).
name: Publish home

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-home
  cancel-in-progress: false

env:
  HOME_PROJECT: crust-home
  PRODUCTION_BRANCH: main
  WRANGLER_VERSION: 4.145.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

      # The page's own address comes from the project, so a name that is taken
      # (Cloudflare adds letters to it) still gets the right links and sitemap.
      - name: Create Pages project if missing
        id: project
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          status=$(curl -sS -o project.json -w '%{http_code}' -H "$auth" "$api/$HOME_PROJECT")
          if [ "$status" = "404" ]; then
            echo "Creating Pages project $HOME_PROJECT"
            body=$(jq -n --arg n "$HOME_PROJECT" --arg b "$PRODUCTION_BRANCH" '{name: $n, production_branch: $b}')
            status=$(curl -sS -o project.json -w '%{http_code}' -X POST -H "$auth" \
              -H "Content-Type: application/json" --data "$body" "$api")
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare API returned $status. Check that the token has 'Cloudflare Pages: Edit'."
            jq -c '.errors' project.json || true
            exit 1
          fi
          echo "url=https://$(jq -r '.result.subdomain' project.json)" >> "$GITHUB_OUTPUT"
          rm project.json

      - name: Render pages
        env:
          BASE_URL: ${{ steps.project.outputs.url }}
        run: npx tsx packages/render/src/cli.ts home/content dist/home

      - name: Photo copies from the last publish
        uses: actions/cache@v4
        with:
          path: .crust-cache/photos
          key: home-photos-v1-${{ hashFiles('home/content/media/**') }}
          restore-keys: home-photos-v1-

      - name: Check and finish the site (crust-publish)
        env:
          HOME_URL: ${{ steps.project.outputs.url }}
        run: cargo run -q -p crust-publish -- dist/home --base-url "$HOME_URL" --media home/content/media --photo-cache .crust-cache/photos --fonts packages/blocks/fonts

      - name: Build the search index (Pagefind)
        run: npx pagefind --site dist/home

      - name: Install Chromium for the accessibility check
        run: npx playwright-core install --with-deps chromium

      - name: Accessibility check (stops the publish on serious issues)
        run: node scripts/check-a11y.mjs dist/home

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist/home \
            --project-name="$HOME_PROJECT" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$GITHUB_SHA"

      - name: Check the live page
        env:
          HOME_URL: ${{ steps.project.outputs.url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 10 "$HOME_URL/" | grep -q 'Design the site. Keep the files.'; then
              echo "Home page is live: $HOME_URL"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet, waiting 15s"
            sleep 15
          done
          echo "::error::$HOME_URL did not serve the new home page within 3 minutes."
          exit 1

      - name: Write job summary
        env:
          HOME_URL: ${{ steps.project.outputs.url }}
        run: |
          {
            echo "### Home page published"
            echo ""
            echo "Live at $HOME_URL"
          } >> "$GITHUB_STEP_SUMMARY"
