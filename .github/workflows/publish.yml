# F008: publish the site. Runs only when started (the admin's "Publish site"
# button, or by hand), so nothing goes live by accident.
# Renders content/ to static HTML, runs crust-publish (checks, sitemap,
# robots.txt, _redirects for renamed pages), and deploys dist/site to the
# Cloudflare Pages project "crust-site". Uses the same Cloudflare secrets
# as the admin preview.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

env:
  SITE_PROJECT: crust-site
  PRODUCTION_BRANCH: main
  WRANGLER_VERSION: 4.145.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

      - name: Create Pages project if missing
        id: project
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          status=$(curl -sS -o project.json -w '%{http_code}' -H "$auth" "$api/$SITE_PROJECT")
          if [ "$status" = "404" ]; then
            echo "Creating Pages project $SITE_PROJECT"
            body=$(jq -n --arg n "$SITE_PROJECT" --arg b "$PRODUCTION_BRANCH" '{name: $n, production_branch: $b}')
            status=$(curl -sS -o project.json -w '%{http_code}' -X POST -H "$auth" \
              -H "Content-Type: application/json" --data "$body" "$api")
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare API returned $status. Check that the token has 'Cloudflare Pages: Edit'."
            jq -c '.errors' project.json || true
            exit 1
          fi
          echo "subdomain=$(jq -r '.result.subdomain' project.json)" >> "$GITHUB_OUTPUT"
          rm project.json

      - name: Work out the site address
        id: site
        env:
          SUBDOMAIN: ${{ steps.project.outputs.subdomain }}
        run: |
          # site.json's baseUrl wins once it's a real address; until then use the Pages address.
          base=$(jq -r '.baseUrl' content/site.json)
          case "$base" in
            ""|*example.*) base="https://$SUBDOMAIN" ;;
          esac
          echo "url=${base%/}" >> "$GITHUB_OUTPUT"

      - name: Render pages
        run: npm run render

      - name: Check and finish the site (crust-publish)
        env:
          BASE_URL: ${{ steps.site.outputs.url }}
        run: cargo run -q -p crust-publish -- dist/site --base-url "$BASE_URL" --redirects content/redirects.json

      - name: Install Chromium for the accessibility check
        run: npx playwright-core install --with-deps chromium

      - name: Accessibility check (stops the publish on serious issues)
        run: node scripts/check-a11y.mjs dist/site

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist/site \
            --project-name="$SITE_PROJECT" \
            --branch="$PRODUCTION_BRANCH" \
            --commit-hash="$GITHUB_SHA"

      - name: Check the live site
        env:
          URL: ${{ steps.site.outputs.url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 10 "$URL/sitemap.xml" | grep -q "<urlset"; then
              echo "Site is live: $URL"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet, waiting 15s"
            sleep 15
          done
          echo "::error::$URL did not serve the new site within 3 minutes."
          exit 1

      - name: Write job summary
        env:
          URL: ${{ steps.site.outputs.url }}
        run: |
          {
            echo "### Site published"
            echo ""
            echo "Live at $URL"
          } >> "$GITHUB_STEP_SUMMARY"
