# F055: Mac and Windows installers for the desktop app, built only when
# started by hand (Actions → Desktop installers → Run workflow). The
# repository is private, so Mac minutes count 10× and Windows 2× against
# the free monthly minutes; one run is roughly 150 counted minutes. Builds
# are unsigned until the owner sets up signing (BLOCKED.md).
#
# F061: with the update key set (secret TAURI_SIGNING_PRIVATE_KEY, its
# password TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and the public half as the
# variable CRUST_UPDATE_PUBKEY; docs/setup-updates.md), the build also makes
# signed update files, and "Put on the downloads site" uploads installers and
# the update feed to the free Cloudflare Pages site the app updates from.
name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which installers to build"
        type: choice
        default: both
        options: [both, mac, windows]
      downloads:
        description: "Put on the downloads site (needs both; everyone with Crust gets this version)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  DOWNLOADS_PROJECT: crust-downloads
  PRODUCTION_BRANCH: main
  WRANGLER_VERSION: 4.145.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Skip if not asked for
        id: wanted
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          NAME: ${{ matrix.name }}
        run: |
          if [ "$PLATFORMS" = "both" ] || [ "$PLATFORMS" = "$NAME" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.wanted.outputs.build == 'true'

      - uses: actions/setup-node@v4
        if: steps.wanted.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.wanted.outputs.build == 'true'
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        if: steps.wanted.outputs.build == 'true'

      - name: Install
        if: steps.wanted.outputs.build == 'true'
        run: npm ci

      - name: Check the update key
        if: steps.wanted.outputs.build == 'true'
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          CRUST_UPDATE_PUBKEY: ${{ vars.CRUST_UPDATE_PUBKEY }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$CRUST_UPDATE_PUBKEY" ]; then
            # The public half is one line of text that decodes to a "untrusted comment" line plus the key.
            # A value that lost part of it (or was pasted decoded) fails here, not 12 minutes into the build.
            if ! printf '%s' "$CRUST_UPDATE_PUBKEY" | tr -d '[:space:]' | base64 -d 2>/dev/null | grep -q '^untrusted comment:'; then
              echo "::error::CRUST_UPDATE_PUBKEY is not the whole public key. Paste everything in public-key.txt (one long line, usually starting with dW50cnVzdGVk), with no quotes or spaces. See docs/setup-updates.md."
              exit 1
            fi
            echo "Update key found: this build updates itself."
          elif [ "$HAS_KEY" != "true" ] && [ -z "$CRUST_UPDATE_PUBKEY" ]; then
            echo "::notice::No update key yet (BLOCKED.md): this build won't update itself."
          else
            echo "::error::The update key needs both halves: the secret TAURI_SIGNING_PRIVATE_KEY and the variable CRUST_UPDATE_PUBKEY. See docs/setup-updates.md."
            exit 1
          fi

      - name: Build the installer
        if: steps.wanted.outputs.build == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CRUST_UPDATE_PUBKEY: ${{ vars.CRUST_UPDATE_PUBKEY }}
          CRUST_UPDATE_FEED: ${{ vars.CRUST_UPDATE_FEED }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Tauri reads the public half from its own config (plugins.updater.pubkey, empty in the repo) when it
            # makes the update files; CRUST_UPDATE_PUBKEY alone only reaches the app's code. Run #3/#4 failed on that.
            config=$(jq -nc --arg key "$CRUST_UPDATE_PUBKEY" '{bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:$key}}}')
            npm run desktop:build -- --target "$TARGET" --config "$config"
          else
            npm run desktop:build -- --target "$TARGET"
          fi

      - name: Keep the installer
        if: steps.wanted.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crust-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

  # F061: the downloads site: installers, what's new and the update feed
  # (scripts/updates-site.ts), on the Cloudflare Pages project
  # "crust-downloads". Only when asked, and only with both installers, so
  # every computer finds its update.
  downloads:
    needs: build
    if: inputs.downloads && inputs.platforms == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the GitHub release that holds the installers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CRUST_UPDATE_FEED: ${{ vars.CRUST_UPDATE_FEED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the installers
        uses: actions/download-artifact@v4
        with:
          path: built

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

      - name: Create Pages project if missing
        id: project
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          status=$(curl -sS -o project.json -w '%{http_code}' -H "$auth" "$api/$DOWNLOADS_PROJECT")
          if [ "$status" = "404" ]; then
            echo "Creating Pages project $DOWNLOADS_PROJECT"
            body=$(jq -n --arg n "$DOWNLOADS_PROJECT" --arg b "$PRODUCTION_BRANCH" '{name: $n, production_branch: $b}')
            status=$(curl -sS -o project.json -w '%{http_code}' -X POST -H "$auth" \
              -H "Content-Type: application/json" --data "$body" "$api")
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare API returned $status. Check that the token has 'Cloudflare Pages: Edit'."
            jq -c '.errors' project.json || true
            exit 1
          fi
          echo "subdomain=$(jq -r '.result.subdomain' project.json)" >> "$GITHUB_OUTPUT"
          rm project.json

      - name: Check the update address
        env:
          SUBDOMAIN: ${{ steps.project.outputs.subdomain }}
        run: |
          actual="https://$SUBDOMAIN/updates/latest.json"
          built_in="${CRUST_UPDATE_FEED:-https://crust-downloads.pages.dev/updates/latest.json}"
          if [ "$actual" != "$built_in" ]; then
            echo "::error::The app looks for updates at $built_in, but the downloads site is at $actual. Set the repository variable CRUST_UPDATE_FEED to $actual and run this again."
            exit 1
          fi

      - name: Put the installers on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages takes nothing over 25 MB a file, so the installers and update files live on the version's
          # release (free, the repository is public). The feed and the download page point there.
          version=$(jq -r .version crates/crust-desktop/tauri.conf.json)
          files=$(find built -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.app.tar.gz' \))
          [ -n "$files" ] || { echo "::error::No installers found to put on the release."; exit 1; }
          # shellcheck disable=SC2086
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" $files --clobber
          else
            gh release create "v$version" $files --target "$GITHUB_SHA" --title "Crust $version" --notes "Installers and update files for Crust $version. The download page has what's new: https://crust-downloads.pages.dev"
          fi

      - name: Put together the downloads site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx scripts/updates-site.ts built dist/downloads

      - name: Upload to Cloudflare Pages
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy dist/downloads \
            --project-name "$DOWNLOADS_PROJECT" --branch "$PRODUCTION_BRANCH" --commit-dirty=true

      - name: Write job summary
        env:
          SUBDOMAIN: ${{ steps.project.outputs.subdomain }}
        run: |
          {
            echo "### Downloads site updated"
            echo ""
            echo "Download page: https://$SUBDOMAIN/"
            echo "Everyone with Crust gets this version the next time it checks (at most a day)."
          } >> "$GITHUB_STEP_SUMMARY"
