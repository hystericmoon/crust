name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: JS tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build admin
        run: npm run build

      - name: Rust tests
        run: cargo test

      - name: Rust lint
        run: cargo clippy -- -D warnings

      - name: Publish sample site
        run: npm run publish:local

      - name: Upload sample site
        uses: actions/upload-artifact@v4
        with:
          name: sample-site
          path: dist/site
          retention-days: 7

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        run: npm run lint:workflows
