name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # F058 raised this from 35: the job took ~30 minutes before the HTTPS
    # client (rustls) arrived. It's a ceiling, not a cost (DECISIONS F058).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # F055: the desktop app (Tauri) needs the Linux window libraries to build.
      - name: Install the desktop app's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: JS tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build admin
        run: npm run build

      - name: Rust tests
        run: cargo test

      - name: Rust lint
        run: cargo clippy -- -D warnings

      # F055: opens the real app window on a virtual screen and checks the
      # builder, saving to the site folder and photos work together.
      - name: Desktop app self-check
        run: |
          cargo build -p crust-desktop --features tauri/custom-protocol
          CRUST_SITE_FOLDER="$RUNNER_TEMP/crust-home/crust-site" CRUST_EXPORT_FOLDER="$RUNNER_TEMP/crust-export" CRUST_SELF_CHECK=1 timeout 180 xvfb-run -a target/debug/crust

      - name: Publish sample site
        run: npm run publish:local

      - name: Upload sample site
        uses: actions/upload-artifact@v4
        with:
          name: sample-site
          path: dist/site
          retention-days: 7

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        run: npm run lint:workflows

  site-checks:
    # F009: axe on every published page, Lighthouse on the sample page.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Install Chromium for the checks
        run: npx playwright-core install --with-deps chromium

      - name: Build the builder (for its own axe check, F040)
        run: npm run build

      - name: Accessibility (axe, no serious issues)
        run: npm run check:a11y

      - name: Performance (Lighthouse 95 or more)
        run: npm run check:perf

  template-check:
    # F047: every template in templates/ (or the sample site) must pass the
    # template quality check. The readable report is a download on the run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install
        run: npm ci

      - name: Install Chromium for the checks
        run: npx playwright-core install --with-deps chromium

      - name: Template quality check
        run: npm run check:template

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-check-report
          path: dist/template-check/index.html
          retention-days: 30
